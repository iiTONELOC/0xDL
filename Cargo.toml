[package]
name = "oxdl"
version = "0.1.4"
edition = "2024"
description = "Asynchronous downloader with progress bars and SHA256 verification."
license = "MIT"
authors = ["Anthony Tropeano anthonytropeano@me.com"]
homepage = "https://github.com/iiTONELOC/0xDL"
repository = "https://github.com/iiTONELOC/0xDL"
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[lib]  
doctest = false

[dependencies]
rand = "0.9.2"
regex = "1.12.2"
reqwest = "0.12.24"
sha2 = "0.10.9"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs"] }
url = "2.5.7"


[features]
net-tests = []
dl-iso-test = []
tests = []
all-tests = ["net-tests", "tests"]
all-tests-w-iso-dl = ["all-tests", "dl-iso-test"]